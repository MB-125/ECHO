name: Build desktop app

# Builds ECHO for Windows, macOS and Linux.
#  • Every push / pull request: run the simulation tests and build all three
#    platforms (downloadable from the run's "Artifacts" section).
#  • Pushing a tag like v0.1.0: also publishes a GitHub Release with installers.
#  • "Run workflow" button in the Actions tab: build on demand.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulation tests
        run: node tests/run-tests.js

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No code-signing certificate: produce unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ECHO-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
