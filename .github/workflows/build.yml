name: Build desktop app

# Builds ECHO for Windows, macOS and Linux.
#  • Every push / pull request: run the simulation tests and build all three
#    platforms (downloadable from the run's "Artifacts" section).
#  • A push to main with a new version in package.json makes the Release by
#    itself (installers + the game file installed apps update from). Pushing a
#    v* tag or publishing a Release by hand does the same.
#  • "Run workflow" button in the Actions tab: build on demand.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    # A published Release, a pushed v* tag, or simply a push to main with a new
    # version in package.json: the release is made here, with everything attached,
    # and installed apps pick the game up from it by themselves.
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Which release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then TAG="${{ github.event.release.tag_name }}";
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then TAG="${{ github.ref_name }}";
          else TAG="v$(node -p "require('./repo/package.json').version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          SKIP=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then SKIP=true; echo "Release $TAG already exists; nothing to do."; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          node-version: 22
      # The game as one page, which installed apps download and switch to by themselves.
      - name: Game update files
        if: steps.tag.outputs.skip != 'true'
        run: |
          node repo/tools/build-web.js
          cp repo/dist/web/index.html dist/echo-game.html
          node -e "const fs=require('fs'),p=require('./repo/package.json');const v=process.argv[1].replace(/^v/,'');fs.writeFileSync('dist/echo-game.json',JSON.stringify({version:v,shell:p.echoShell||1,size:fs.statSync('dist/echo-game.html').size}))" "${{ steps.tag.outputs.tag }}"
          cat dist/echo-game.json
      - name: Publish release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ECHO ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: ${{ github.event_name != 'release' }}
